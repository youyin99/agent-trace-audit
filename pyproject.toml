[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trace-audit"
version = "1.0.0"
description = "Redacted agent event collection, timeline, alerts, and provenance reports"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "youyin99"}]
keywords = ["agent-security", "audit", "provenance", "incident-response"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-trace-audit = "agent_trace_audit.cli:main"

[tool.setuptools.packages.find]
include = ["agent_trace_audit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
